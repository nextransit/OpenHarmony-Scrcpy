name: Release CI/CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install macOS-only dependencies
        if: runner.os == 'macOS'
        run: pip install pyobjc-framework-Quartz

      - name: Syntax check (py_compile)
        run: python -m py_compile main.py ohscrcpy_client.py stream.py

      - name: Compile all modules
        run: |
          python -c "
          import compileall, sys, re
          ok = compileall.compile_dir('.', quiet=1, rx=re.compile(r'(venv|venv312|\.git|__pycache__|hdc|bin-rk3568|ohscrcpy_server)'))
          sys.exit(0 if ok else 1)
          "

      - name: Run unit tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest tests.test_platform tests.test_branding -v

      - name: Run unit tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: python -m unittest tests.test_platform tests.test_branding -v

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
