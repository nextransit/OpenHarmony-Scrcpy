  </g>

  <rect x="474" y="183" width="76" height="11" rx="5.5" fill="#06152b" fill-opacity="0.65"/>
  <rect x="455" y="804" width="114" height="10" rx="5" fill="#d5fbff" fill-opacity="0.66"/>

